# Сверка живых каталогов с репо: npm, PyPI, реестр MCP, GitHub Release, ZIP, сайт,
# skills.sh, ClawHub, HOL.
# Ловит забытый npm publish, отставший деплой Pages и пропавший ассет.
# Не в основном CI: зависит от внешних сервисов, PR за них не отвечает.
# Локально: python scripts/check_live_distribution.py
name: live-distribution

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Живые поверхности отдают текущую версию
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_live_distribution.py
