name: Publish to npm

# На каждый тег v*: опубликовать пакет в npm через Trusted Publishing (OIDC),
# без токена в секретах репозитория.
#
# Разовая настройка на стороне npm, ДО первого тега после подключения:
#   npmjs.com -> пакет humanizer-ru -> Settings -> Trusted Publisher
#     Publisher:      GitHub Actions
#     Organization:   ilyautov
#     Repository:     humanizer-ru
#     Workflow file:  publish-npm.yml   <-- ровно имя этого файла
#     Environment:    (пусто)
#
# Зачем вообще: раньше публикация делалась руками, и канал отстал на версию
# (npm 3.24.0 при 3.25.0 в репозитории). Ручной шаг в конце релиза забывается,
# автоматический нет.
#
# workflow_dispatch нужен, чтобы до-опубликовать уже выпущенный тег.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Существующий тег релиза, например v3.25.0"
        required: true

permissions:
  contents: read

jobs:
  npm:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC -> Trusted Publishing в npm
    steps:
      # Тег идёт через env и проверяется: подстановка ${{ }} прямо в run
      # исполнила бы всё, что введено в поле workflow_dispatch.
      - name: Определить тег
        id: tag
        shell: bash
        env:
          REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "тег не похож на vX.Y.Z: $REF" >&2; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Версия в теге должна совпасть с package.json
        shell: bash
        env:
          V: ${{ steps.tag.outputs.version }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          echo "тег=$V package.json=$PKG"
          [ "$V" = "$PKG" ] || { echo "версия тега не совпала с package.json" >&2; exit 1; }

      # Trusted Publishing требует npm 11.5.1 и новее: в образе может быть старее.
      - name: Свежий npm
        run: npm install -g npm@latest

      - name: Эта версия уже в npm? Тогда выходим без ошибки
        id: check
        shell: bash
        env:
          V: ${{ steps.tag.outputs.version }}
        run: |
          if npm view "humanizer-ru@$V" version >/dev/null 2>&1; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "npm уже отдаёт $V, публиковать нечего"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      # Версия уже в npm: публиковать нечего, зато можно проверить Trusted Publishing.
      # Обмен OIDC-токена в npm идёт до проверки --dry-run, в подробном логе видно,
      # удался ли он («Successfully retrieved and set token») и почему нет.
      - name: Диагностика Trusted Publishing без публикации
        if: steps.check.outputs.skip == '1'
        shell: bash
        run: |
          npm publish --access public --dry-run --loglevel verbose 2>&1 \
            | grep -iE "oidc|publishing to|E404|npm error" \
            | sed 's/\x1b\[[0-9;]*m//g' || true

      - name: Публикация
        if: steps.check.outputs.skip == '0'
        run: npm publish --access public
