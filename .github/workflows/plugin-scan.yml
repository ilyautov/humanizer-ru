# Security-гейт HOL AI Plugin Scanner: требование каталога awesome-codex-plugins
# (score >= 80, без high/critical). Локальный прогон: pip install plugin-scanner
# && plugin-scanner lint .
name: plugin-scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: hashgraph-online/ai-plugin-scanner-action@91897efebffdfebe2443192569c75cbacb3be7db # v1
