# Security-гейт HOL AI Plugin Scanner: требование каталога awesome-codex-plugins
# (score >= 80, без high/critical). Локальный прогон: pip install plugin-scanner
# && plugin-scanner lint .
name: plugin-scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashgraph-online/ai-plugin-scanner-action@fc91f16ca4e6c0c919e807238f27b329dd828cbe # v1
