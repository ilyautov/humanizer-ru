name: Publish to ClawHub

# Реестр скиллов OpenClaw: https://clawhub.ai
#
# Срабатывает на каждый опубликованный GitHub Release (публикует в реестр, как
# npm и PyPI) и вручную через workflow_dispatch (там можно выбрать preview).
# На коммиты в ветки не реагирует.
# Разовая настройка, до первого реального выпуска:
#   1. clawhub.ai -> Sign in with GitHub
#   2. создать токен в веб-интерфейсе
#   3. положить его в Settings -> Secrets and variables -> Actions
#      под именем CLAWHUB_TOKEN
# Без токена режим «preview» отработает, «publish» упадёт на авторизации.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: preview показывает план, publish выкладывает в реестр
        type: choice
        options: [preview, publish]
        default: preview
      owner:
        description: >-
          Хендл публикатора на clawhub.ai. Нужен, когда слаг заняли другие:
          у нас так вышло с content-strategy и contract-review.
        type: string
        default: ""

jobs:
  clawhub:
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@v0.24.0
    with:
      root: skills
      owner: ${{ inputs.owner }}
      # release публикует всегда, ручной запуск по умолчанию только показывает план
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'publish' }}
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
