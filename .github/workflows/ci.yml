name: CI

# Бесплатный детерминированный гейт: self-test скилла, sanity-скан и
# eval-харнес в метрики-режиме (без реальных детекторов и LLM-судьи, без
# ключей и сети). Тяжёлые детекторы (torch/transformers) и облачные API в CI
# НЕ запускаются — это сделало бы прогон платным и недетерминированным.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Регресс-тесты метрик (test_markers)
        run: python scripts/test_markers.py

      - name: Регресс-тесты score чистоты (test_score)
        run: python scripts/test_score.py

      - name: Смоук-тесты CLI-сканера (test_scan)
        run: python scripts/test_scan.py

      - name: Self-test скилла (lint_skill)
        run: python scripts/lint_skill.py

      # Цель шага: «сканер запускается и отдаёт валидный JSON», а НЕ «текст чистый».
      # Exit 1 у scan.py означает «нашёл HARD BANS» — для формального человеческого
      # текста (Википедия: «является», тире) это штатно (см. eval/RESULTS.md, FP-аудит).
      - name: Sanity-скан (scan.py запускается и отдаёт валидный JSON)
        run: |
          set +e
          python skills/humanizer-ru/scripts/scan.py eval/corpus/human/wiki_baikal.txt --json > /tmp/scan.json
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then echo "scan.py упал (exit $code)"; exit "$code"; fi
          python -c "import json; r = json.load(open('/tmp/scan.json')); print('scan ok, hard bans:', r['hard_ban_count'])"

      # Regression-гейт против eval/baseline.json (коммитится): raw AI не должен
      # терять детекцию, human-контроль не должен получать новые ложные
      # срабатывания. Обновление эталона: python eval/run_eval.py --save-baseline.
      - name: Eval-харнес (метрики-only) + regression-гейт
        run: python eval/run_eval.py --baseline eval/baseline.json

      # Граница активации скилла: детерминированный слой (язык/модальность +
      # guard scope-фраз в описании из SKILL.md). LLM-роутер опционален и в CI
      # НЕ гоняется (нужна Ollama/ключ). Падает, если near-miss (код/английский)
      # принят за триггер или из описания пропала scope-граница.
      - name: Trigger-eval (граница активации, детерминированный слой)
        run: python eval/run_triggers.py
